<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- 1. Importa o arquivo de temas global -->
  <link rel="stylesheet" href="themes.css">
  <style>
    html, body {
      margin: 0; padding: 0; height: 100vh; width: 100vw;
      background: transparent !important;
      overflow: hidden;
    }

    .splash-box {
      width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      
      /* 2. Usa as variáveis do tema no fundo, texto e borda */
      background: var(--bg-body);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      border-radius: 24px; 
      box-sizing: border-box;
      
      /* Transição suave caso o JS mude o tema logo ao abrir */
      transition: background 0.3s, color 0.3s, border-color 0.3s;
    }

    .splash-logo { width: 130px; height: 130px; object-fit: contain }
    
    .title { 
      font-size: 18px; 
      font-weight: 600; 
      letter-spacing: -0.5px; 
      color: var(--text-main); 
    }
    
    /* 3. Efeito Shimmer adaptável às cores do tema */
    .subtitle {
      font-size: 12px;
      margin-top: 6px;
      background: linear-gradient(90deg, var(--text-muted) 0%, var(--text-main) 50%, var(--text-muted) 100%);
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 2.5s linear infinite;
    }

    @keyframes shimmer {
      0% { background-position: 200% center; }
      100% { background-position: -200% center; }
    }

    /* 4. BÔNUS: Efeito Neon no Splash se o tema for Cyberpunk */
    body.cyberpunk-mode .title {
      color: #00f0ff;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
    }
  </style>
</head>
<body>
  <div class="splash-box">
    <img src="./assets/logo.png" alt="Monster Hub" class="splash-logo">
    <div class="title">MONSTER HUB</div>
    <div class="subtitle">Iniciando serviços...</div>
  </div>

  <!-- 5. O Script que aplica o tema salvo -->
  <script>
    const savedTheme = localStorage.getItem("theme") || "dark";
    
    if (savedTheme === "light") {
      document.body.classList.add("light-mode");
    } else if (savedTheme === "cream") {
      document.body.classList.add("cream-purple-mode");
    } else if (savedTheme === "cyberpunk") {
      document.body.classList.add("cyberpunk-mode");
    }
  </script>
</body>
</html>
