<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>MONSTER HUB</title>
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <!-- BARRA DE TÍTULO CUSTOMIZADA -->
  <div class="titlebar">
    <div class="titlebar-drag">
      <span class="app-title">MONSTER HUB</span>
    </div>
    <div class="titlebar-controls">
      <!-- Passo 4: Ícone de atualizar minimalista -->
      <button id="refresh" class="icon-btn" title="Atualizar"><span class="icon-inner">&#xE72C;</span></button>
      <button id="btn-settings" class="icon-btn" title="Configurações">&#xE713;</button>
      <div class="divider"></div>
      <button id="btn-minimize" class="win-btn">&#xE921;</button>
      <button id="btn-maximize" class="win-btn">&#xE922;</button>
      <button id="btn-close" class="win-btn close">&#xE8BB;</button>
    </div>
  </div>

  <!-- MENU DE CONFIGURAÇÕES -->
  <div id="settings-menu" class="settings-menu hidden">
    <h3 data-i18n="settings_title">Configurações</h3>
    
    <div class="setting-item">
      <label data-i18n="language_label">Idioma</label>
      <select id="language-select">
        <option value="pt">Português</option>
        <option value="en">English</option>
      </select>
    </div>

    <div class="setting-item" style="margin-top: 12px;">
      <label data-i18n="theme_label">Tema</label>
      <!-- Passo 2 e 3: Seletor com os 3 temas -->
      <select id="theme-select">
        <option value="dark" data-i18n="theme_dark">🌙 Escuro</option>
        <option value="light" data-i18n="theme_light">☁️ Claro</option>
        <option value="cyberpunk" data-i18n="theme_cyberpunk">🌆 Cyberpunk</option>
      </select>
    </div>
  </div>

  <!-- CONTEÚDO PRINCIPAL -->
  <div class="app-content">
    <header>
      <div class="nav-dropdown">
        <div class="nav-active" id="nav-text-current" data-i18n="nav_connected">CONECTADOS</div>
        <div class="nav-dropdown-content">
          <div class="nav-option" id="nav-text-other" data-i18n="nav_off">OFF</div>
        </div>
      </div>
    </header>
    
    <main id="grid" class="grid"></main>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
